name: Build APK

# Builds an installable debug APK on every push to main and on version tags.
# Fonts are binary, so they are NOT committed to the repo — CI downloads them.
# On tags like v1.0, the APK is attached to a GitHub Release automatically.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Vazirmatn fonts
        run: |
          mkdir -p app/src/main/res/font
          base=https://github.com/rastikerdar/vazirmatn/raw/v33.003/fonts/ttf
          curl -fsSL -o app/src/main/res/font/vazirmatn_regular.ttf $base/Vazirmatn-Regular.ttf
          curl -fsSL -o app/src/main/res/font/vazirmatn_medium.ttf $base/Vazirmatn-Medium.ttf
          curl -fsSL -o app/src/main/res/font/vazirmatn_bold.ttf $base/Vazirmatn-Bold.ttf
          ls -la app/src/main/res/font/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk pizza-dough-v1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pizza-dough-v1
          path: pizza-dough-v1.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pizza-dough-v1.apk
          generate_release_notes: true
